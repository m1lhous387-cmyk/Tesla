name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/vinylonair/teslabridge

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VOATeslaBridge"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vinylonair.teslabridge'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vinylonair.teslabridge"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="VOA Tesla Bridge"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TidalListenerService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".BridgeForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/vinylonair/teslabridge/TidalListenerService.kt
          package com.vinylonair.teslabridge
          import android.service.notification.NotificationListenerService
          class TidalListenerService : NotificationListenerService()
          EOF

          cat << 'EOF' > app/src/main/java/com/vinylonair/teslabridge/BridgeForegroundService.kt
          package com.vinylonair.teslabridge

          import android.app.*
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONObject

          class BridgeForegroundService : Service() {
              companion object {
                  var liveStatus: String = "In attesa..."
                  var isServiceRunning: Boolean = false
              }

              private lateinit var webView: WebView
              private val handler = Handler(Looper.getMainLooper())
              private var roomId = "TESLA-DAVIDE"

              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!isServiceRunning) return
                      readTidalAndSend()
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  roomId = intent?.getStringExtra("ROOM_ID") ?: "TESLA-DAVIDE"
                  startForegroundNotification()
                  setupHiddenWebView()
                  isServiceRunning = true
                  handler.post(pollRunnable)
                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "voa_bridge_channel"
                  val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val channel = NotificationChannel(channelId, "VOA Tesla Bridge", NotificationManager.IMPORTANCE_LOW)
                  mgr.createNotificationChannel(channel)
                  val notif = Notification.Builder(this, channelId)
                      .setContentTitle("VinylOnAir Tesla Bridge")
                      .setContentText("Sync MQTT attivo ($roomId)")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  startForeground(101, notif)
              }

              private fun setupHiddenWebView() {
                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                  }
                  val topic = "vinylonair/tesla/" + roomId.uppercase().replace(Regex("[^A-Z0-9-]"), "")
                  val html = """
                      <!DOCTYPE html>
                      <html>
                      <head><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script></head>
                      <body>
                      <script>
                        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                          clientId: 'voa_phone_' + Math.random().toString(16).substr(2, 8),
                          clean: true,
                          reconnectPeriod: 2000
                        });
                        window.mqttConnected = false;
                        client.on('connect', () => { window.mqttConnected = true; });
                        client.on('close', () => { window.mqttConnected = false; });
                        client.on('offline', () => { window.mqttConnected = false; });

                        window.sendTrack = function(jsonStr) {
                          if (client && client.connected) {
                            client.publish('$topic', jsonStr, { qos: 0, retain: true });
                            return "OK";
                          }
                          return "CONNECTING";
                        };
                      </script>
                      </body>
                      </html>
                  """.trimIndent()
                  webView.loadDataWithBaseURL("https://vinylonair.com", html, "text/html", "UTF-8", null)
              }

              private fun readTidalAndSend() {
                  try {
                      val msm = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val listener = ComponentName(this, TidalListenerService::class.java)
                      val controllers: List<MediaController> = msm.getActiveSessions(listener)

                      if (controllers.isEmpty()) {
                          liveStatus = "Nessun player attivo sul telefono"
                          return
                      }

                      val target = controllers.firstOrNull { it.packageName.contains("tidal", ignoreCase = true) }
                          ?: controllers.first()

                      val meta = target.metadata
                      val state = target.playbackState
                      if (meta == null || state == null) {
                          liveStatus = "Player trovato (${target.packageName}) ma nessun brano"
                          return
                      }

                      val title = meta.getString(MediaMetadata.METADATA_KEY_TITLE) ?: return
                      val artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST)
                          ?: meta.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST) ?: ""
                      val durationSec = (meta.getLong(MediaMetadata.METADATA_KEY_DURATION) / 1000.0)
                      val posSec = (state.position / 1000.0)
                      val isPlaying = (state.state == PlaybackState.STATE_PLAYING)

                      val payload = JSONObject().apply {
                          put("artist", artist)
                          put("title", title)
                          put("position", posSec)
                          put("duration", if (durationSec > 0) durationSec else 210.0)
                          put("isPlaying", isPlaying)
                      }
                      val escaped = payload.toString().replace("\\", "\\\\").replace("'", "\\'")
                      webView.evaluateJavascript("window.sendTrack ? window.sendTrack('$escaped') : 'WAIT'") { res ->
                          val cleanRes = res?.replace("\"", "") ?: ""
                          liveStatus = if (cleanRes == "OK") {
                              "Inviato: $artist - $title (${posSec.toInt()}s)"
                          } else {
                              "Letto: $artist - $title (Connessione cloud...)"
                          }
                      }
                  } catch (e: SecurityException) {
                      liveStatus = "ERRORE PERMESSO: attiva Accesso Notifiche!"
                  }
              }

              override fun onDestroy() {
                  isServiceRunning = false
                  liveStatus = "Servizio fermo"
                  handler.removeCallbacks(pollRunnable)
                  if (::webView.isInitialized) webView.destroy()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/vinylonair/teslabridge/MainActivity.kt
          package com.vinylonair.teslabridge

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              private val uiHandler = Handler(Looper.getMainLooper())
              private lateinit var statusText: TextView
              private lateinit var btnToggle: Button

              private val statusUpdater = object : Runnable {
                  override fun run() {
                      statusText.text = BridgeForegroundService.liveStatus
                      btnToggle.text = if (BridgeForegroundService.isServiceRunning) "SYNC ATTIVO (Tocca per fermare)" else "2. AVVIA SYNC ORA"
                      uiHandler.postDelayed(this, 800)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("voa_prefs", MODE_PRIVATE)
                  val savedRoom = prefs.getString("room", "TESLA-DAVIDE") ?: "TESLA-DAVIDE"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.BLACK)
                      setPadding(64, 64, 64, 64)
                  }
                  val title = TextView(this).apply {
                      text = "VinylOnAir • Tesla Bridge v2"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  val input = EditText(this).apply {
                      setText(savedRoom)
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      textSize = 18f
                  }
                  val btnPerm = Button(this).apply {
                      text = "1. Abilita Lettura Tidal (Permesso)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      }
                  }
                  btnToggle = Button(this).apply {
                      text = "2. AVVIA SYNC ORA"
                      textSize = 16f
                      setOnClickListener {
                          val room = input.text.toString().trim().uppercase().ifEmpty { "TESLA-DAVIDE" }
                          prefs.edit().putString("room", room).apply()
                          val svc = Intent(this@MainActivity, BridgeForegroundService::class.java)
                          if (!BridgeForegroundService.isServiceRunning) {
                              svc.putExtra("ROOM_ID", room)
                              startForegroundService(svc)
                          } else {
                              stopService(svc)
                          }
                      }
                  }
                  statusText = TextView(this).apply {
                      text = "In attesa..."
                      textSize = 14f
                      setTextColor(Color.parseColor("#7DD3FC"))
                      gravity = Gravity.CENTER
                  }

                  root.addView(title)
                  root.addView(input, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = 36 })
                  root.addView(btnPerm, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = 36 })
                  root.addView(btnToggle, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = 20 })
                  root.addView(statusText, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = 36 })
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  uiHandler.post(statusUpdater)
              }

              override fun onPause() {
                  super.onPause()
                  uiHandler.removeCallbacks(statusUpdater)
              }
          }
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOA-Tesla-Bridge-v2
          path: app/build/outputs/apk/debug/app-debug.apk
